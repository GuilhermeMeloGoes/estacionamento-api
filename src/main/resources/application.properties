spring.application.name=estacionamento

# Configura��es Locale
spring.web.locale-resolver=fixed
spring.web.locale=pt_BR

# MySQL Database Connection Properties
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.url=jdbc:mysql://localhost:3306/estacionamento_api?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
#spring.datasource.username=admin
#spring.datasource.password=admin


# Postgresql Database Connection Properties
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/estacionamento_api
spring.datasource.username=postgres
spring.datasource.password=root


# JPA
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Springdoc OpenApi 3.1 & Swagger 3
springdoc.swagger-ui.path=/docs-estacionamento.html
springdoc.api-docs.path=/docs-estacionamento
springdoc.packages-to-scan=com.estacionamento.web.controller